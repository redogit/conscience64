name: REDOGIT contract

on:
  push:
    branches: [main]
    paths:
      - 'redogit.json'
      - 'tools/redogit_selfcheck.py'
      - 'tools/verify_research_manifest.py'
      - 'research/cross-carrier/**'
      - '.github/workflows/redogit.yml'
  pull_request:
    paths:
      - 'redogit.json'
      - 'tools/redogit_selfcheck.py'
      - 'tools/verify_research_manifest.py'
      - 'research/cross-carrier/**'
      - '.github/workflows/redogit.yml'

permissions:
  contents: read

jobs:
  verify:
    uses: redogit/redogit/.github/workflows/verify-redogit.yml@10c49a25daaff74277bc8e0e84719fc289f4ad3f
