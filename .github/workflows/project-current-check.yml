name: Verify current research manifest

on:
  pull_request:
    paths:
      - 'research/projects/**'
      - 'tools/check_project_current.mjs'
      - '.github/workflows/project-current-check.yml'
  push:
    branches: [main]
    paths:
      - 'research/projects/**'
      - 'tools/check_project_current.mjs'
      - '.github/workflows/project-current-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Materialize exact commit
        shell: bash
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Verify preserved registry and forward-only successors
        run: node tools/check_project_current.mjs
