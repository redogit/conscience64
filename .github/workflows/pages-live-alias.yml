name: Verify live Pages surface

on:
  workflow_run:
    workflows: ["Sync Conscience64 Pages source"]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/pages-live-alias.yml'
      - 'play/reference-rules.json'
      - 'play/musilanguage/radio.htm'
      - 'tools/generate-reference-aliases.mjs'
      - 'tools/check_public_reference_aliases.mjs'
      - 'tools/public-routes.mjs'
      - 'tools/check_public_routes.mjs'
  workflow_dispatch:

permissions: {}

concurrency:
  group: conscience64-pages-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-live-surface:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
    steps:
      - name: Materialize intended public surface
        shell: bash
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"

          ref="${EXPECTED_SHA:-main}"
          if [ -n "$EXPECTED_SHA" ]; then
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          fi

          git fetch --depth=1 origin "$ref"
          git checkout --detach FETCH_HEAD

          intended_sha="$(git rev-parse HEAD)"
          if [ -n "$EXPECTED_SHA" ]; then
            test "$intended_sha" = "$EXPECTED_SHA"
          fi
          echo "INTENDED_SHA=$intended_sha" >> "$GITHUB_ENV"

      - name: Require exact published source before live verification
        if: ${{ github.event_name == 'workflow_run' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          remote_sha="$(git ls-remote origin refs/heads/gh-pages | awk '{print $1}')"
          test "$remote_sha" = "$EXPECTED_SHA"

      - name: Reconfirm exact published source before network-edge checks
        if: ${{ github.event_name == 'workflow_run' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          remote_sha="$(git ls-remote origin refs/heads/gh-pages | awk '{print $1}')"
          test "$remote_sha" = "$EXPECTED_SHA"

      - name: Verify declared aliases and canonical routes at the network edge
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$INTENDED_SHA"
          PAGES_URL='https://redogit.github.io/conscience64/' GITHUB_SHA="$INTENDED_SHA" node tools/check_public_reference_aliases.mjs
          PAGES_URL='https://redogit.github.io/conscience64/' GITHUB_SHA="$INTENDED_SHA" node tools/check_public_routes.mjs

      - name: Reconfirm exact published source after network-edge checks
        if: ${{ github.event_name == 'workflow_run' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          remote_sha="$(git ls-remote origin refs/heads/gh-pages | awk '{print $1}')"
          test "$remote_sha" = "$EXPECTED_SHA"
