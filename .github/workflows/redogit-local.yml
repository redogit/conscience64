name: REDOGIT local verification

on:
  push:
    branches: [main]
    paths:
      - 'redogit.json'
      - 'history/**'
      - 'app.js'
      - 'space-lens-memory.js'
      - 'space-lens-qa.js'
      - 'space-lens-local-search.js'
      - 'space-lens-web-search.js'
      - 'space-lens-external-gate.js'
      - 'space-lens-human-builder.js'
      - 'index.html'
      - 'data-manifest.json'
      - 'data-*.txt'
      - 'API.md'
      - 'BUILD_AUDIT.json'
      - 'tools/**'
      - 'research/projects/**'
      - 'research/history/**'
      - 'research/cross-carrier/2026-09-12/v2.2/**'
      - '.github/workflows/redogit-local.yml'
      - '.github/workflows/pages-sync.yml'
  pull_request:
    paths:
      - 'redogit.json'
      - 'history/**'
      - 'app.js'
      - 'space-lens-memory.js'
      - 'space-lens-qa.js'
      - 'space-lens-local-search.js'
      - 'space-lens-web-search.js'
      - 'space-lens-external-gate.js'
      - 'space-lens-human-builder.js'
      - 'index.html'
      - 'data-manifest.json'
      - 'data-*.txt'
      - 'API.md'
      - 'BUILD_AUDIT.json'
      - 'tools/**'
      - 'research/projects/**'
      - 'research/history/**'
      - 'research/cross-carrier/2026-09-12/v2.2/**'
      - '.github/workflows/redogit-local.yml'
      - '.github/workflows/pages-sync.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: conscience64-redogit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Materialize exact public commit without external Actions
        shell: bash
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Check history restoration and revision lineage
        run: |
          node history/test.mjs
          node history/knowledge-test.mjs
      - name: Check browser API and Space Lens syntax
        run: |
          node --check app.js
          node --check space-lens-memory.js
          node --check space-lens-qa.js
          node --check space-lens-local-search.js
          node --check space-lens-web-search.js
          node --check space-lens-external-gate.js
          node --check space-lens-human-builder.js
      - name: Check site data and browser API startup
        run: node tools/check_site.mjs
      - name: Check explicit Pages publication contract and public link integrity
        run: |
          node tools/check_pages_sync.mjs
          node tools/public-routes.test.mjs
      - name: Check Space Lens human-readable answers
        run: node tools/check_space_lens_qa.mjs
      - name: Check Space Lens persistent learning memory
        run: node tools/check_space_lens_memory.mjs
      - name: Check Space Lens local search engine
        run: node tools/check_space_lens_local_search.mjs
      - name: Check Space Lens in-page Web Search
        run: node tools/check_space_lens_web_search.mjs
      - name: Check real-need external search refinement
        run: node tools/check_space_lens_external_gate.mjs
      - name: Check Space Lens Human Builder
        run: node tools/check_space_lens_human_builder.mjs
      - name: Check compact REDOGIT surface
        run: python3 tools/redogit_selfcheck.py
      - name: Replay SQL v5 finite constructor
        shell: bash
        run: |
          set -euo pipefail
          src='research/cross-carrier/2026-09-12/v2.2/sql/symmetry_aware_constructor_v5.cpp'
          g++ -std=c++20 -O2 "$src" -o /tmp/symmetry_aware_constructor_v5
          /tmp/symmetry_aware_constructor_v5 | tee /tmp/symmetry_aware_constructor_v5.log
          grep -F 'class=3310' /tmp/symmetry_aware_constructor_v5.log
          grep -F 'generic_sym obs=5 scores=56 wordops=2912' /tmp/symmetry_aware_constructor_v5.log
          grep -F 'paired_t15 obs=8 scores=20 wordops=2080' /tmp/symmetry_aware_constructor_v5.log
          grep -F 'selected_t=7 first_survivors=500' /tmp/symmetry_aware_constructor_v5.log
      - name: Verify compact Max-Cut successor certificate
        run: >-
          python3 research/cross-carrier/2026-09-12/v2.2/selection/verify_compact_maxcut28_min.py
          research/cross-carrier/2026-09-12/v2.2/selection/HIGHGIRTH20_COMPACT_MAXCUT28_CERT.min.json
      - name: Verify committed research surface bytes and hashes
        run: >-
          python3 tools/verify_research_manifest.py
          research/cross-carrier/2026-09-12/v2.2/repository_manifest.json
          research/cross-carrier/2026-09-12/v2.2
