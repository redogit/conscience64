name: Hodge Decision Field

on:
  push:
    branches: [main, research/hodge-decision-field-20260914]
    paths:
      - 'research/hodge/**'
      - '.github/workflows/hodge-decision-field-check.yml'
  pull_request:
    paths:
      - 'research/hodge/**'
      - '.github/workflows/hodge-decision-field-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hodge-decision-field-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Materialize exact commit
        shell: bash
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 --version

      - name: Re-run finite decision-field computation
        shell: bash
        run: |
          set -euo pipefail
          python3 research/hodge/df_hodge_02.py > "$RUNNER_TEMP/df_hodge_02.json"
          python3 -m py_compile research/hodge/df_hodge_02.py

      - name: Compare fresh result with committed checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          fresh=json.loads(Path(os.environ['RUNNER_TEMP'],'df_hodge_02.json').read_text())
          committed=json.loads(Path('research/hodge/DF_HODGE_02_RESULT.json').read_text())
          assert fresh['experiment']==committed['experiment']=='DF-HODGE-02'
          assert fresh['minimum_sufficient_feature_count']==committed['new_minimum_sufficient_feature_count']==4
          assert fresh['minimum_sufficient_feature_sets']==[committed['unique_minimum_sufficient_feature_set']]
          assert fresh['new_coordinate']==committed['admitted_coordinate']=='transport_verified'
          pair={tuple(sorted((x['left'][0],x['right'][0]))) for x in fresh['baseline_three_coordinate_conflicts']}
          assert ('m39_post_transport','m39_pre_transport') in pair
          assert 'no algebraicity' in committed['claim_ceiling'].lower()
          assert 'p-vs-np' in committed['claim_ceiling'].lower()
          print('PASS Hodge finite checkpoint and evidence firewall')
          PY
