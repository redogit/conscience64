name: Scheduler probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scheduler-probe.yml'
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Prove a runner can start
        run: printf 'CONSCIENCE64_ACTIONS_SCHEDULER_OK\n'
