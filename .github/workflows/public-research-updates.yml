name: Public research updates

on:
  pull_request:
    paths:
      - 'research/projects/public-updates/**'
      - '.github/workflows/public-research-updates.yml'
  push:
    branches: [main]
    paths:
      - 'research/projects/public-updates/**'
      - '.github/workflows/public-research-updates.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-research-updates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Materialize exact commit
        shell: bash
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Test fail-closed public/private admission
        run: python3 -m unittest discover -s research/projects/public-updates -p 'test_*.py' -v
      - name: Verify deterministic public snapshot and record operation provenance
        shell: bash
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 research/projects/public-updates/build_public_updates.py --check --source-revision "$GITHUB_SHA" --generated-at "$NOW" --result ci-validated --endpoint "https://redogit.github.io/conscience64/research/projects/public-updates/data/latest.json"
          node --check research/projects/public-updates/app.js
      - name: Observe deployed static endpoint on periodic/manual checks
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          URL="https://redogit.github.io/conscience64/research/projects/public-updates/data/latest.json"
          TMP="$(mktemp)"
          curl --fail --silent --show-error --location --retry 6 --retry-delay 5 "$URL" -o "$TMP"
          cmp "$TMP" research/projects/public-updates/data/latest.json
          SHA="$(sha256sum "$TMP" | awk '{print $1}')"
          echo "PUBLIC_RESEARCH_UPDATE_ENDPOINT_OBSERVED revision=$GITHUB_SHA endpoint=$URL snapshot_sha256=$SHA"
