name: Knowledge bridge check

on:
  pull_request:
    paths:
      - 'knowledge/**'
      - 'docs/superpowers/specs/2026-09-14-conscience64-knowledge-bridge-design.md'
      - 'docs/superpowers/plans/2026-09-14-conscience64-knowledge-bridge.md'
      - '.github/workflows/knowledge-bridge-check.yml'
      - '.gitignore'
  push:
    branches: [main]
    paths:
      - 'knowledge/**'
      - '.github/workflows/knowledge-bridge-check.yml'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VERIFY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Materialize exact commit without external Actions
        shell: bash
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$VERIFY_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$VERIFY_SHA"

      - name: Compile knowledge bridge modules
        run: |
          set -euo pipefail
          python3 -m py_compile knowledge/*.py

      - name: Run knowledge bridge tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s knowledge -p 'test_*.py' -v

      - name: Dry-run repository teaching against exact revision
        run: |
          set -euo pipefail
          python3 -m knowledge.teach_repo \
            --root . \
            --revision "$VERIFY_SHA" \
            --dry-run
