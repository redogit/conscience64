name: Sync Conscience64 Pages source

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'data-manifest.json'
      - 'data-*.txt'
      - 'API.md'
      - 'BUILD_AUDIT.json'
      - 'README.md'
      - 'SITE_DATA_RECOVERY.md'
      - 'research/projects/**'
      - 'tools/check_site.mjs'
      - '.nojekyll'
      - '.github/workflows/pages-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: conscience64-pages-source
  cancel-in-progress: true

jobs:
  publish-source:
    runs-on: ubuntu-latest
    steps:
      - name: Materialize exact main commit
        shell: bash
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Verify site data and browser API before publishing
        run: node tools/check_site.mjs

      - name: Advance gh-pages to exact main commit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "$GITHUB_SHA:refs/heads/gh-pages"
