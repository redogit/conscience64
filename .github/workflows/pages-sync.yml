name: Sync Conscience64 Pages source

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'space-lens-memory.js'
      - 'space-lens-qa.js'
      - 'space-lens-local-search.js'
      - 'data-manifest.json'
      - 'data-*.txt'
      - 'API.md'
      - 'BUILD_AUDIT.json'
      - 'README.md'
      - 'SITE_DATA_RECOVERY.md'
      - 'research/projects/**'
      - 'play/**'
      - 'coordinate-space/**'
      - 'tools/check_site.mjs'
      - 'tools/check_space_lens_qa.mjs'
      - 'tools/check_space_lens_memory.mjs'
      - 'tools/check_space_lens_local_search.mjs'
      - '.nojekyll'
      - '.github/workflows/pages-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: conscience64-pages-source
  cancel-in-progress: true

jobs:
  publish-source:
    runs-on: ubuntu-latest
    steps:
      - name: Materialize exact main commit
        shell: bash
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Verify site data and browser API before publishing
        run: node tools/check_site.mjs

      - name: Verify Space Lens answer, learning, and local-search layers before publishing
        run: |
          node --check space-lens-memory.js
          node --check space-lens-qa.js
          node --check space-lens-local-search.js
          node tools/check_space_lens_qa.mjs
          node tools/check_space_lens_memory.mjs
          node tools/check_space_lens_local_search.mjs

      - name: Verify public playground projects before publishing
        run: node play/test.mjs

      - name: Exercise public projects in Chrome before publishing
        run: node play/browser-test.mjs

      - name: Verify Coordinate Space public release before publishing
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/coordinate-space-venv"
          PY="$RUNNER_TEMP/coordinate-space-venv/bin/python"
          "$PY" -m pip install -r coordinate-space/requirements.txt playwright==1.57.0
          "$PY" coordinate-space/verify_release.py
          "$PY" coordinate-space/test_public.py
          "$PY" coordinate-space/example.py
          node coordinate-space/test_codec.mjs
          "$PY" coordinate-space/browser_checks.py

      - name: Verify Musilanguage radio and real Conscience64 integration
        shell: bash
        run: |
          set -euo pipefail
          node --check play/musilanguage/engine.js
          node --check play/musilanguage/radio.js
          "$RUNNER_TEMP/coordinate-space-venv/bin/python" play/musilanguage/radio-test.py

      - name: Advance gh-pages to exact main commit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "$GITHUB_SHA:refs/heads/gh-pages"
