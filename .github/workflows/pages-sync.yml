name: Sync Conscience64 public test bed

on:
  push:
    branches: [main]
    paths:
      - 'public-testbed/**'
      - 'play/musilanguage/**'
      - 'PUBLIC_TESTBED_APPROVAL.json'
      - 'tools/build-public-testbed.mjs'
      - 'tools/check-public-testbed.mjs'
      - 'tools/check-public-testbed-edge.mjs'
      - 'tools/private-origin-boundary.mjs'
      - 'tools/check_pages_sync.mjs'
      - '.github/workflows/pages-sync.yml'
      - '.github/workflows/pages-live-alias.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: conscience64-public-testbed-source
  cancel-in-progress: true

jobs:
  publish-testbed:
    runs-on: ubuntu-latest
    steps:
      - name: Materialize exact main source revision
        shell: bash
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Verify public-testbed scope authorization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('PUBLIC_TESTBED_APPROVAL.json').read_text(encoding='utf-8'))
          assert d.get('schema') == 'redogit/public-testbed-approval/v1'
          assert d.get('approved') is True
          assert d.get('scope') == 'public-testbed-plus-musilanguage'
          assert d.get('issue') == 166
          review=d.get('review',{})
          for key in (
              'source_isolation_required',
              'privacy_boundary_required',
              'experimental_label_required',
              'accessibility_required',
              'network_edge_verification_required',
          ):
              assert review.get(key) is True, key
          assert d.get('commercial_license_granted') is False
          assert '/play/musilanguage/' in d.get('authorized_routes',[])
          print('PASS public-testbed + curated Musilanguage scope authorization')
          PY

      - name: Verify isolated projection contract
        run: |
          set -euo pipefail
          node tools/check_pages_sync.mjs
          node tools/check-public-testbed.mjs --revision "$GITHUB_SHA"

      - name: Build exact curated public projection
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/public-testbed-projection"
          node tools/build-public-testbed.mjs --root . --out "$OUT" --revision "$GITHUB_SHA"
          test -f "$OUT/index.html"
          test -f "$OUT/projection-manifest.json"
          test ! -e "$OUT/README.md"
          test ! -e "$OUT/research"
          test -f "$OUT/play/musilanguage/index.html"
          test ! -e "$OUT/play/index.html"
          test ! -e "$OUT/play/mmo"
          echo "PROJECTION_DIR=$OUT" >> "$GITHUB_ENV"

      - name: Publish projection tree with rollback lineage
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PUB="$RUNNER_TEMP/pages-publish"
          git init "$PUB"
          cd "$PUB"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin gh-pages
          git checkout --detach FETCH_HEAD
          lease_sha="$(git rev-parse HEAD)"
          git rm -r -f .
          cp -a "$PROJECTION_DIR"/. .
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish public test bed + Musilanguage from ${GITHUB_SHA}"
          projection_commit="$(git rev-parse HEAD)"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force-with-lease=refs/heads/gh-pages:"$lease_sha" origin HEAD:refs/heads/gh-pages
          remote_sha="$(git ls-remote origin refs/heads/gh-pages | awk '{print $1}')"
          test "$remote_sha" = "$projection_commit"
          echo "PUBLIC_PROJECTION_SYNC source=$GITHUB_SHA projection_commit=$projection_commit predecessor=$lease_sha"
