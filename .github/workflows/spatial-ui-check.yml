name: Verify spatial UI

on:
  push:
    branches: ['rollout/**']
    paths:
      - 'space-lens-gpu.js'
      - 'space-lens-master.js'
      - 'spatial-ui-test.mjs'
      - 'index.html'
      - 'navigation/**'
      - 'research/projects/index.html'
      - 'play/**'
      - 'history/**'
      - '.github/workflows/spatial-ui-check.yml'
  pull_request:
    paths:
      - 'space-lens-gpu.js'
      - 'space-lens-master.js'
      - 'spatial-ui-test.mjs'
      - 'index.html'
      - 'navigation/**'
      - 'research/projects/index.html'
      - 'play/**'
      - 'history/**'
      - '.github/workflows/spatial-ui-check.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Materialize exact commit without external Actions
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Syntax check spatial and Context Horizon modules
        run: |
          node --check space-lens-gpu.js
          node --check space-lens-master.js
          node --check navigation/context-horizon/work-inventory.mjs
          node --check navigation/context-horizon/work-inventory.test.mjs
          node --check navigation/context-horizon/current-chat-artifacts.test.mjs
          node --check navigation/context-horizon/named-architecture-expansion.test.mjs
          node --check navigation/context-horizon/library-work-expansion.test.mjs
          node --check navigation/context-horizon/repair-successors.test.mjs
          node --check navigation/context-horizon/route-registry.mjs
          node --check navigation/context-horizon/engine.mjs
          node --check navigation/context-horizon/questions.mjs
          node --check navigation/context-horizon/presenter.mjs
          node --check navigation/context-horizon/page-adapter.mjs
          node --check navigation/context-horizon/browser-test.mjs
      - name: Verify Context Horizon preservation inventory
        run: node navigation/context-horizon/work-inventory.test.mjs
      - name: Verify current-chat artifact preservation boundary
        run: node navigation/context-horizon/current-chat-artifacts.test.mjs
      - name: Verify nested architecture preservation boundary
        run: node navigation/context-horizon/named-architecture-expansion.test.mjs
      - name: Verify Library and public-tool preservation boundary
        run: node navigation/context-horizon/library-work-expansion.test.mjs
      - name: Verify repair-successor preservation boundary
        run: node navigation/context-horizon/repair-successors.test.mjs
      - name: Synchronize repair-successor snapshot on rollout push
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          node navigation/context-horizon/work-inventory.mjs --write
          if ! git diff --quiet -- navigation/context-horizon/WORK_INVENTORY.json; then
            git config user.name redogit
            git config user.email 69516108+redogit@users.noreply.github.com
            git add navigation/context-horizon/WORK_INVENTORY.json
            git commit -m "data: synchronize repair-successor Context Horizon inventory"
            git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Verify committed preservation snapshot is synchronized
        run: node navigation/context-horizon/work-inventory.mjs --check
      - name: Verify Context Horizon route graph
        run: node navigation/context-horizon/route-registry.test.mjs
      - name: Verify Context Horizon ranking
        run: node navigation/context-horizon/engine.test.mjs
      - name: Verify Context Horizon questions
        run: node navigation/context-horizon/questions.test.mjs
      - name: Verify spatial, preservation, and hidden-boundary contracts
        run: node spatial-ui-test.mjs
      - name: Verify existing history contracts
        run: |
          node history/test.mjs
          node history/knowledge-test.mjs
      - name: Exercise Context Horizon accessibility and fallback
        run: node navigation/context-horizon/browser-test.mjs
