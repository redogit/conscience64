name: Invariant Atlas integrity
on:
  push:
    paths: ['research/invariant-atlas/**', '.github/workflows/invariant-atlas-check.yml']
  pull_request:
    paths: ['research/invariant-atlas/**', '.github/workflows/invariant-atlas-check.yml']
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 research/invariant-atlas/verify.py
      - run: python3 -m unittest discover -s research/invariant-atlas -p 'test_verify.py' -v
