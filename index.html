:root{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color-scheme:dark;--bg:#05070e;--fg:#eef4ff;--muted:#9eabc4;--line:#26314b}*{box-sizing:border-box}body{margin:0;background:#05070e;color:var(--fg);min-height:100vh}main{width:min(1120px,calc(100% - 2rem));margin:auto;padding:1.4rem 0 3rem;position:relative;z-index:2}header{padding:1rem 0;border-bottom:1px solid var(--line)}h1{font:600 clamp(1.5rem,4vw,2.7rem)/1.05 ui-sans-serif,system-ui;margin:.2rem 0}p{color:var(--muted)}.irpo{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-top:1rem}.irpo section{border:1px solid var(--line);background:rgba(11,16,32,.87);border-radius:.7rem;padding:.8rem;min-height:11rem}.irpo h2{font:700 1rem ui-sans-serif,system-ui;margin:0 0 .5rem}.irpo pre{white-space:pre-wrap;word-break:break-word;margin:0;color:var(--fg);font-size:.82rem}#space{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;opacity:.72}.api-note{border-top:1px solid var(--line);margin-top:1rem;padding-top:.8rem}@media(max-width:850px){.irpo{grid-template-columns:1fr 1fr}}@media(max-width:520px){.irpo{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){#space{opacity:.45}}@media(forced-colors:active){#space{display:none}.irpo section{border:1px solid CanvasText}}
</style></head><body><canvas id="space" aria-hidden="true"></canvas><main itemprop="mainEntity" itemscope itemtype="https://schema.org/Dataset" itemid="uoid:sha256:aa3994488ddfcf5f0d828e679b598dd905d4d1fe958c97fd6303e357171d6599"><header><h1 itemprop="name">Conscience64</h1><p itemprop="description">Universal object space. API only. Visible surface: I / R / P / O.</p><meta itemprop="identifier" content="uoid:sha256:aa3994488ddfcf5f0d828e679b598dd905d4d1fe958c97fd6303e357171d6599"></header><div class="irpo" aria-label="I R P O state"><section itemscope itemtype="https://schema.org/Thing"><h2 itemprop="name">I — Input</h2><pre id="irpo-i" itemprop="description"></pre></section><section itemscope itemtype="https://schema.org/Thing"><h2 itemprop="name">R — Relation / Scratch</h2><pre id="irpo-r" itemprop="description"></pre></section><section itemscope itemtype="https://schema.org/Thing"><h2 itemprop="name">P — Plan</h2><pre id="irpo-p" itemprop="description"></pre></section><section itemscope itemtype="https://schema.org/Thing"><h2 itemprop="name">O — Output</h2><pre id="irpo-o" itemprop="description"></pre></section></div><p class="api-note">JavaScript API: <code>window.Conscience64API</code>. Call <code>Conscience64API.help()</code>. No UI controls are exposed.</p></main><script type="module">
const SPACE_UOID="uoid:sha256:aa3994488ddfcf5f0d828e679b598dd905d4d1fe958c97fd6303e357171d6599";
const B64=await Promise.all(["./data-00.txt","./data-01.txt","./data-02.txt","./data-03.txt","./data-04.txt","./data-05.txt","./data-06.txt"].map(u=>fetch(u).then(r=>{if(!r.ok)throw new Error(`Failed to load ${u}`);return r.text()}))).then(a=>a.join(""));
const IRPO_HISTORY=[];
function b64bytes(s){const bin=atob(s),out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out}
async function gunzipText(b64){if(!('DecompressionStream' in globalThis))throw new Error('This browser lacks DecompressionStream. Use a current browser.');const ds=new DecompressionStream('gzip');const stream=new Blob([b64bytes(b64)]).stream().pipeThrough(ds);return await new Response(stream).text()}
const SPACE=JSON.parse(await gunzipText(B64));
const byUoid=new Map(SPACE.map(x=>[x.uoid,x]));const byLogicalId=new Map(SPACE.filter(x=>x.logicalId).map(x=>[x.logicalId,x]));
function tokenize(s){return String(s??'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').split(/[^a-z0-9:_-]+/).filter(Boolean)}
function flattenRecord(r){const f=[r.uoid,r.objectType,r.logicalId,r.label,r.description,r.kind,r.domain,r.category,r.time_layer,r.authority,r.provenance,r.relation,r.source,r.target,r.basis,...(r.nonstem_tags||[]),JSON.stringify(r.microdata?.properties||{})];return f.filter(Boolean).join(' ').toLowerCase()}
const SEARCH_DOCS=SPACE.map((r,index)=>{const text=flattenRecord(r);return{index,r,text,tokens:new Set(tokenize(text))}});
const clone=x=>x==null?null:structuredClone(x);const arr=v=>v==null?[]:(Array.isArray(v)?v:[v]);
function resolve(id){return byUoid.get(id)||byLogicalId.get(id)||null}
function simpleSearch(query,options={}){const q=String(query??'').trim().toLowerCase(),qt=tokenize(q);if(!q)return{query:q,total:0,results:[],spaceUoid:SPACE_UOID};const ranked=[];for(const d of SEARCH_DOCS){let score=0;if(d.text.includes(q))score+=12;const label=String(d.r.label||'').toLowerCase();if(label===q)score+=25;else if(label.startsWith(q))score+=15;else if(label.includes(q))score+=9;for(const t of qt){if(d.tokens.has(t))score+=4;else if([...d.tokens].some(x=>x.startsWith(t)))score+=1}if(score>0)ranked.push([d.r,score])}ranked.sort((a,b)=>b[1]-a[1]||(b[0].degree||0)-(a[0].degree||0)||String(a[0].label||'').localeCompare(String(b[0].label||'')));const offset=Math.max(0,options.offset||0),limit=Math.min(500,Math.max(1,options.limit||25));return{query:q,total:ranked.length,offset,limit,spaceUoid:SPACE_UOID,results:ranked.slice(offset,offset+limit).map(([r,s])=>({...clone(r),searchScore:s}))}}
function intersects(v,e){const a=arr(v).map(String),b=arr(e).map(String);return !b.length||b.some(x=>a.includes(x))}
function advancedSearch(spec={}){const text=String(spec.text??'').trim().toLowerCase(),kinds=arr(spec.kind||spec.kinds),types=arr(spec.objectType||spec.objectTypes),times=arr(spec.timeLayer||spec.timeLayers),auths=arr(spec.authority||spec.authorities),domains=arr(spec.domain||spec.domains),rels=arr(spec.relation||spec.relations),ids=arr(spec.logicalId||spec.logicalIds),prefix=String(spec.uoidPrefix||''),prov=String(spec.provenance||'').toLowerCase(),min=spec.minDegree==null?null:Number(spec.minDegree),max=spec.maxDegree==null?null:Number(spec.maxDegree),has=arr(spec.hasFields),eq=spec.equals||{};let rows=SEARCH_DOCS.filter(d=>{const r=d.r;if(text&&!d.text.includes(text)&&!tokenize(text).every(t=>d.tokens.has(t)))return false;if(kinds.length&&!intersects(r.kind,kinds))return false;if(types.length&&!intersects(r.objectType,types))return false;if(times.length&&!intersects(r.time_layer,times))return false;if(auths.length&&!intersects(r.authority,auths))return false;if(domains.length&&!intersects(r.domain,domains))return false;if(rels.length&&!intersects(r.relation,rels))return false;if(ids.length&&!intersects(r.logicalId,ids))return false;if(prefix&&!r.uoid.startsWith(prefix))return false;if(prov&&!String(r.provenance||r.basis||'').toLowerCase().includes(prov))return false;if(min!==null&&Number(r.degree||0)<min)return false;if(max!==null&&Number(r.degree||0)>max)return false;if(has.some(f=>r[f]==null))return false;for(const[k,v]of Object.entries(eq)){const rv=k.split('.').reduce((o,p)=>o?.[p],r);if(JSON.stringify(rv)!==JSON.stringify(v))return false}return true}).map(d=>d.r);if(spec.from||spec.to){const from=spec.from?resolve(spec.from)?.uoid:null,to=spec.to?resolve(spec.to)?.uoid:null;rows=rows.filter(r=>r.objectType==='research-edge'&&(!from||r.sourceUoid===from)&&(!to||r.targetUoid===to))}const sortBy=spec.sortBy||'degree',dir=spec.sortDir==='asc'?1:-1;rows.sort((a,b)=>sortBy==='label'?dir*String(a.label||'').localeCompare(String(b.label||'')):sortBy==='uoid'?dir*String(a.uoid).localeCompare(String(b.uoid)):dir*(Number(a[sortBy]||0)-Number(b[sortBy]||0)));const offset=Math.max(0,spec.offset||0),limit=Math.min(1000,Math.max(1,spec.limit||100));return{spec:clone(spec),total:rows.length,offset,limit,spaceUoid:SPACE_UOID,results:rows.slice(offset,offset+limit).map(clone)}}
function relations(id,spec={}){const obj=resolve(id);if(!obj)return{object:null,total:0,relations:[]};const uid=obj.uoid;let rs=SPACE.filter(r=>r.objectType==='research-edge'&&(r.sourceUoid===uid||r.targetUoid===uid));if(spec.direction==='out')rs=rs.filter(r=>r.sourceUoid===uid);if(spec.direction==='in')rs=rs.filter(r=>r.targetUoid===uid);if(spec.relation)rs=rs.filter(r=>arr(spec.relation).includes(r.relation));return{object:clone(obj),total:rs.length,relations:rs.map(clone)}}
function traverse(start,spec={}){const root=resolve(start);if(!root)return{start:null,nodes:[],edges:[]};const depth=Math.max(0,Math.min(8,spec.depth??1)),rf=new Set(arr(spec.relation)),direction=spec.direction||'both',seen=new Set([root.uoid]),nodes=[root],edges=[];let frontier=[root.uoid];for(let d=0;d<depth;d++){const next=[];for(const uid of frontier){for(const e of SPACE){if(e.objectType!=='research-edge'||(rf.size&&!rf.has(e.relation)))continue;let other=null;if(direction!=='in'&&e.sourceUoid===uid)other=e.targetUoid;if(direction!=='out'&&e.targetUoid===uid)other=e.sourceUoid;if(!other)continue;edges.push(e);if(!seen.has(other)){seen.add(other);const n=byUoid.get(other);if(n){nodes.push(n);next.push(other)}}}}frontier=next;if(!frontier.length)break}return{start:clone(root),nodes:nodes.map(clone),edges:edges.map(clone)}}
function microdata(id){const r=resolve(id);return r?clone(r.microdata):null}
function microdataHTML(id){const r=resolve(id);if(!r)return null;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const m=r.microdata,props=Object.entries(m.properties||{}).map(([k,v])=>`<meta itemprop="${esc(k)}" content="${esc(typeof v==='string'?v:JSON.stringify(v))}">`).join('');return`<article itemscope itemtype="${esc(m.itemType)}" itemid="${esc(m.itemId)}">${props}</article>`}
function stats(){const byType={},byKind={};for(const r of SPACE){byType[r.objectType]=(byType[r.objectType]||0)+1;if(r.kind)byKind[r.kind]=(byKind[r.kind]||0)+1}return{spaceUoid:SPACE_UOID,total:SPACE.length,byType,byKind}}
function updateIRPO(x){const safe=v=>typeof v==='string'?v:JSON.stringify(v,null,2);for(const k of['I','R','P','O']){const el=document.getElementById(`irpo-${k.toLowerCase()}`);if(el)el.textContent=safe(x[k])}}
function irpo(input={}){const I=input.I??input.input??null,R=input.R??input.reason??input.relation??{},P=input.P??input.plan??{action:'search.simple'};let O=input.O??null;const action=typeof P==='string'?P:(P.action||'search.simple');if(O==null){if(action==='search.simple')O=simpleSearch(typeof I==='string'?I:(I?.query||''),P.options||{});else if(action==='search.advanced')O=advancedSearch({...((typeof I==='object'&&I)?I:{}),...(R||{}),...(P.spec||{})});else if(action==='get')O=clone(resolve(typeof I==='string'?I:I?.id));else if(action==='relations')O=relations(typeof I==='string'?I:I?.id,R||{});else if(action==='traverse')O=traverse(typeof I==='string'?I:I?.id,R||{});else O={status:'NO_EXECUTOR',message:`Unknown P.action: ${action}`}}const rec={I,R,P,O,at:new Date().toISOString(),spaceUoid:SPACE_UOID};IRPO_HISTORY.push(rec);if(IRPO_HISTORY.length>512)IRPO_HISTORY.splice(0,IRPO_HISTORY.length-512);updateIRPO(rec);return clone(rec)}
const API=Object.freeze({version:'1.0.0',spaceUoid:SPACE_UOID,search:Object.freeze({simple:simpleSearch,advanced:advancedSearch}),get:id=>clone(resolve(id)),relations,traverse,microdata,microdataHTML,irpo,history:()=>clone(IRPO_HISTORY),stats,all:()=>SPACE.map(clone),help:()=>({simple:'Conscience64API.search.simple("physics black hole", {limit:20})',advanced:'Conscience64API.search.advanced({text:"language", minDegree:5})',get:'Conscience64API.get("project:physics")',relations:'Conscience64API.relations("project:physics", {direction:"out"})',traverse:'Conscience64API.traverse("project:orbit", {depth:2})',microdata:'Conscience64API.microdata("project:orbit")',irpo:'Conscience64API.irpo({I:"black hole",R:{},P:{action:"search.simple"}})'}});globalThis.Conscience64API=API;
addEventListener('message',async event=>{const m=event.data;if(!m||m.type!=='conscience64.api'||!m.id)return;const reply={type:'conscience64.api.result',id:m.id,ok:true,result:null};try{const args=Array.isArray(m.args)?m.args:[],route={'search.simple':()=>simpleSearch(...args),'search.advanced':()=>advancedSearch(...args),'get':()=>API.get(...args),'relations':()=>relations(...args),'traverse':()=>traverse(...args),'microdata':()=>microdata(...args),'irpo':()=>irpo(...args),'stats':()=>stats()}[String(m.method||'')];if(!route)throw new Error(`Unknown API method: ${m.method}`);reply.result=await route()}catch(e){reply.ok=false;reply.error=String(e?.message||e)}event.source?.postMessage(reply,'*')});
function draw(){const c=document.getElementById('space'),x=c.getContext('2d');if(!x)return;const pts=SPACE.filter(r=>r.objectType==='research-node').slice(0,140),seed=[...new Date().toISOString().slice(0,10)].reduce((a,ch)=>Math.imul(a^ch.charCodeAt(0),16777619)>>>0,2166136261),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;function frame(now){const d=Math.min(devicePixelRatio||1,2),w=Math.max(2,Math.floor(c.clientWidth*d)),h=Math.max(2,Math.floor(c.clientHeight*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h}const m=Math.min(w,h),cx=w/2,cy=h/2,t=reduced?0:now/1000;x.fillStyle='#05070e';x.fillRect(0,0,w,h);const g=x.createRadialGradient(cx,cy,0,cx,cy,m*.13);g.addColorStop(0,'#000');g.addColorStop(.7,'#070710');g.addColorStop(1,'#5b3f72');x.fillStyle=g;x.beginPath();x.arc(cx,cy,m*.12,0,Math.PI*2);x.fill();pts.forEach((r,i)=>{const hsh=parseInt(r.uoid.slice(-8),16)>>>0,rad=.18+((hsh%1000)/1000)*.28,speed=.015+((hsh>>>8)%100)/8000,phase=((hsh^seed)%6283)/1000+t*speed*((i%2)?1:-1),px=cx+Math.cos(phase)*rad*m,py=cy+Math.sin(phase)*rad*m*.58;x.fillStyle=i%3===0?'#8dd8ff':i%3===1?'#ffd486':'#c7ffac';x.globalAlpha=.55;x.beginPath();x.arc(px,py,Math.max(1,m*.0025),0,Math.PI*2);x.fill()});x.globalAlpha=1;requestAnimationFrame(frame)}requestAnimationFrame(frame)}
updateIRPO({I:`Searchable privacy-safe space: ${SPACE.length} universal objects.`,R:'All objects are content-addressed with UOIDs and carry microdata. Search does not promote a relation into evidence.',P:{action:'API_ONLY',available:['search.simple','search.advanced','get','relations','traverse','microdata','irpo']},O:stats()});draw();dispatchEvent(new CustomEvent('conscience64-ready',{detail:stats()}));
</script></body></html>
